name: Managed CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  managed:
    name: Managed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      STOCKFISH_UCI_PATH: ''
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Restore
        run: dotnet restore Stockfish.Uci.sln

      - name: Build
        run: dotnet build Stockfish.Uci.sln --configuration Release --no-restore

      - name: Test without an engine
        run: dotnet test Stockfish.Uci.sln --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format Stockfish.Uci.sln --verify-no-changes --severity warn --no-restore

      - name: Pack library only
        run: dotnet pack src/Stockfish.Uci/Stockfish.Uci.csproj --configuration Release --no-build --output artifacts/packages

      - name: Verify managed-only package
        shell: bash
        run: python scripts/verify-package.py --package artifacts/packages/*.nupkg
